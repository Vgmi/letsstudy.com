name: Package Let'sStudy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package web app for Windows
        run: |
          mkdir -p dist/Let'sStudy-Windows
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg dist/Let'sStudy-Windows/
          cp README.md dist/Let'sStudy-Windows/
          zip -r "Let'sStudy-Windows.zip" dist/Let'sStudy-Windows
      - uses: actions/upload-artifact@v4
        with:
          name: letsstudy-windows
          path: Let'sStudy-Windows.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Android package from the installable PWA
        run: |
          npx --yes pwa-builder-sdk package https://vgmi.github.io/letsstudy.com/ \
            --platform android \
            --out ./dist/pwa
          apk="$(find ./dist/pwa -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" letsstudy-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: letsstudy-android
          path: letsstudy-android.apk
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/letsstudy-windows/*
            artifacts/letsstudy-android/**/*.apk
