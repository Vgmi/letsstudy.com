name: Package Let'sStudy

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package web app for Windows
        run: |
          mkdir -p dist/letsstudy-windows
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg dist/letsstudy-windows/
          cp README.md dist/letsstudy-windows/
          zip -r "Let'sStudy-Windows.zip" dist/letsstudy-windows
      - uses: actions/upload-artifact@v4
        with:
          name: letsstudy-windows
          path: Let'sStudy-Windows.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build signed Android APK from the installable PWA
        run: |
          yes "" | npx --yes @bubblewrap/cli init \
            --manifest=https://vgmi.github.io/letsstudy.com/manifest.webmanifest \
            --directory=./android
          cd android
          BUBBLEWRAP_KEYSTORE_PASSWORD="$GITHUB_SHA" \
            BUBBLEWRAP_KEY_PASSWORD="$GITHUB_SHA" \
            npx --yes @bubblewrap/cli build --skipPwaValidation
          cp app-release-signed.apk ../letsstudy-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: letsstudy-android
          path: letsstudy-android.apk
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/letsstudy-windows/*
            artifacts/letsstudy-android/**/*.apk
